<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gs1-go · live GS1 DataMatrix (WebAssembly)</title>
<style>
  :root { --bg:#fbf8fd; --card:#fff; --ink:#2b2540; --muted:#7a7291; --line:#ece6f3;
    --accent:#b596e8; --pink:#f5b8d2; --good:#2f8f6b; --bad:#c24d5b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 36px 22px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  code { font: 13px ui-monospace, monospace; background:#f3eefa; padding:1px 5px; border-radius:5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:18px; }
  textarea { width:100%; min-height:64px; resize:vertical; font:16px ui-monospace, monospace; color:var(--ink);
    border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; outline:none; background:#fdfcff; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #b596e833; }
  .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin-top:12px; font-size:14px; }
  .row label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .presets button { font:13px ui-sans-serif, system-ui; border:1px solid var(--line); background:#f8f4fd;
    color:var(--ink); border-radius:99px; padding:4px 11px; cursor:pointer; }
  .presets button:hover { border-color: var(--accent); }
  .out { display:grid; grid-template-columns: 300px 1fr; gap:22px; align-items:start; }
  .sym { background:#fff; border-radius:14px; border:1px solid var(--line); min-height:300px;
    display:flex; align-items:center; justify-content:center; padding:14px; }
  .sym svg { width:100%; height:auto; max-height:272px; image-rendering:pixelated; }
  .sym { position: relative; }
  .sym.stale svg { opacity: .18; filter: blur(1px); transition: opacity .15s; }
  .out.stale .stats, .out.stale table, .out.stale .foot { opacity: .35; }
  .sym .err { color:var(--bad); font-size:14px; text-align:center; padding:10px; }
  .sym.stale .err { position:absolute; inset:auto 12px 12px 12px; background:#fff8f9;
    border:1px solid #f6d3d8; border-radius:10px; }
  .stats { display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .stat { border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .stat b { display:block; font-size:22px; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
  .stat span { color:var(--muted); font-size:12px; }
  .stat.hi { background: linear-gradient(135deg, #f4ecff, #fdeef5); border-color: #e6d8fb; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:14px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.ai { font-family: ui-monospace, monospace; white-space:nowrap; }
  td.v { font-family: ui-monospace, monospace; word-break: break-all; }
  .foot { color:var(--muted); font-size:12px; margin-top:6px; }
  .loading { color: var(--muted); }
  @media (max-width: 700px) { .out { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Live GS1 DataMatrix</h1>
  <p class="sub">The <code>symbol</code> package of <a href="https://github.com/mintktkr/gs1-go/tree/feat/datamatrix-perf">gs1-go</a>
    compiled to WebAssembly. Every keystroke re-encodes the symbol in your browser. Nothing is sent anywhere.</p>

  <section class="card">
    <textarea id="in" spellcheck="false" autocomplete="off">(01)04150000021126(17)250630(10)ABC123</textarea>
    <div class="row presets">
      <span style="color:var(--muted)">try:</span>
      <button data-v="(01)04150000021126(17)250630(10)ABC123(21)SN0001">pharma pack</button>
      <button data-v="(00)106141411234567897">SSCC</button>
      <button data-v="(01)07802800716135">GTIN only</button>
      <button data-v="(01)09506000134352(17)201231(10)4512(21)12345678901234">GS1 example</button>
      <button data-big>fill 144×144</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="gs1" checked> GS1 mode <small style="color:var(--muted)">(parse AIs, FNC1)</small></label>
      <label><input type="checkbox" id="rect"> rectangular</label>
      <label><input type="checkbox" id="cache" checked> reuse <code>Encoder</code> <small style="color:var(--muted)">(layout cache)</small></label>
    </div>
  </section>

  <section class="card out" id="out">
    <div class="sym" id="sym"><span class="loading">loading WebAssembly…</span></div>
    <div>
      <div class="stats">
        <div class="stat hi"><b id="perop">–</b><span>encode time (Go, average)</span></div>
        <div class="stat"><b id="size">–</b><span>symbol size (modules)</span></div>
        <div class="stat"><b id="total">–</b><span>one encode + SVG on screen</span></div>
        <div class="stat"><b id="rate">–</b><span>encodes per second</span></div>
      </div>
      <table id="els"></table>
      <p class="foot" id="foot"></p>
    </div>
  </section>
</main>

<script src="wasm_exec.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const input = $("in"), gs1 = $("gs1"), rect = $("rect"), cache = $("cache");

function fmtNs(ns) {
  if (ns < 1e3) return ns.toFixed(0) + " ns";
  if (ns < 1e6) return (ns / 1e3).toFixed(ns < 1e4 ? 2 : 1) + " µs";
  return (ns / 1e6).toFixed(2) + " ms";
}

function render() {
  const opts = { gs1: gs1.checked, rect: rect.checked, cache: cache.checked };
  // One encode plus drawing it: what a keystroke actually costs.
  const t0 = performance.now();
  const r = gs1dm(input.value, opts);
  const sym = $("sym");
  if (!r.error) sym.innerHTML = r.svg; // generated by the encoder: numbers only
  const shown = performance.now() - t0;

  const err = document.createElement("div");
  err.className = "err";
  if (r.error) {
    // Keep the last valid symbol, faded, while the input is incomplete.
    sym.querySelector(".err")?.remove();
    sym.classList.add("stale");
    $("out").classList.add("stale");
    err.textContent = r.error;
    sym.append(err);
    return;
  }
  sym.classList.remove("stale");
  $("out").classList.remove("stale");
  $("total").textContent = shown < 1 ? "< 1 ms" : shown.toFixed(1) + " ms";
  $("size").textContent = r.rows + " × " + r.cols;
  renderElements(r.elements);
  history.replaceState(null, "", "#" + encodeURIComponent(input.value));

  // Then measure encoding alone, averaged: browser timers are too coarse
  // for a single encode of a few microseconds.
  const b = gs1dm(input.value, { ...opts, bench: true });
  $("perop").textContent = fmtNs(b.perOpNs);
  $("rate").textContent = Math.round(1e9 / b.perOpNs).toLocaleString();
  $("foot").textContent = "encode time averaged over " + b.iters.toLocaleString() +
    " re-encodes (~3 ms), since browser timers are too coarse to time one encode.";
}

function renderElements(els) {
  const t = $("els");
  t.replaceChildren();
  if (!els.length) return;
  const head = t.insertRow();
  for (const h of ["AI", "name", "value"]) {
    const th = document.createElement("th");
    th.textContent = h;
    head.append(th);
  }
  for (const e of els) {
    const tr = t.insertRow();
    for (const [cls, v] of [["ai", "(" + e.ai + ")"], ["", e.name], ["v", e.value]]) {
      const td = tr.insertCell();
      td.className = cls;
      td.textContent = v;
    }
  }
}

// 144x144 filler: the GTIN plus sixteen 90-character internal fields.
const big = "(01)04150000021126" + ("(91)" + "ABCDEFGHIJ".repeat(9)).repeat(16);
document.querySelectorAll(".presets button").forEach((b) => b.addEventListener("click", () => {
  input.value = b.dataset.big !== undefined ? big : b.dataset.v;
  gs1.checked = true;
  render();
  input.focus();
}));
for (const el of [input, gs1, rect, cache]) el.addEventListener("input", render);

// The input lives in the URL hash, so a symbol can be shared as a link.
if (location.hash.length > 1) input.value = decodeURIComponent(location.hash.slice(1));

const go = new Go();
fetch("demo.wasm")
  .then((r) => r.arrayBuffer())
  .then((buf) => WebAssembly.instantiate(buf, go.importObject))
  .then(({ instance }) => { go.run(instance); render(); })
  .catch((e) => { $("sym").textContent = "could not load demo.wasm: " + e; });
</script>
</body>
</html>
